# Cron trigger for the status checks (see index.js). Deployed by hand with wrangler on
# Distari's Cloudflare account; secrets GH_APP_PRIVATE_KEY (PKCS#8 PEM) set with
# `wrangler secret put`. No routes and no workers.dev URL: it only runs on its schedule.
name = "distari-status-trigger"
main = "index.js"
compatibility_date = "2026-09-01"
account_id = "e9cfe12d8e35c82ab809a705bc186b5c" # accounts@distari.com
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/5 * * * *"]

[vars]
GH_APP_CLIENT_ID = "Iv23li46VYi2sXyo9vmn"
GH_APP_INSTALLATION_ID = "178500757"

[observability]
enabled = true
